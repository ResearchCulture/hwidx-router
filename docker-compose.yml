services:
  hwidx-router:
    image: ghcr.io/researchculture/hwidx-router:latest
    container_name: hwidx-router
    networks:
      - http
    ports:
      - "8080:8080/tcp"
    environment:
      - NODE_ENV=production
      # Simple Analytics website to report redirects and API calls to; leave empty to disable
      - SA_HOSTNAME=${SA_HOSTNAME:-}
      # Most posts to Simple Analytics outstanding at once; events past this are dropped
      - SA_MAX_IN_FLIGHT=${SA_MAX_IN_FLIGHT:-16}
    volumes:
      #- ./config:/hwidx/config:ro
      - ../hwidx:/hwidx/config:ro
      # Index cache, usage stats and link check state, kept between restarts
      - ${HWIDX_CACHE_PATH:-./cache}:/hwidx/cache
    restart: unless-stopped

networks:
  http:
    external: true